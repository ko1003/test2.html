<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decision Tree - Interactive Visualizer</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .back-btn { color: var(--accent-blue); text-decoration: none; font-weight: bold; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    .panel { background: var(--card-bg); border: 1px solid #334155; border-radius: 8px; padding: 20px; }
    .control-group { margin-bottom: 18px; }
    .control-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .control-group input[type="range"] { width: 100%; }
    .btn { width: 100%; padding: 10px; background: var(--accent-blue); border: none; border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; }
    canvas { background: #0b1120; border-radius: 8px; border: 1px solid #334155; display: block; width: 100%; height: auto; }
    .exp { margin-top: 20px; line-height: 1.6; color: #cbd5e1; }
    .exp h3 { color: var(--accent-green); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <span style="color: var(--accent-blue); font-size: 0.85rem; text-transform: uppercase;">Supervised Learning</span>
        <h2>4. Decision Tree</h2>
      </div>
      <a href="ml_visualizers_index.html" class="back-btn">⬅ กลับไปที่เมนูหลัก</a>
    </header>

    <div class="grid">
      <div class="panel" id="controls"></div>
      <div>
        <canvas id="vizCanvas" width="600" height="400"></canvas>
        <div class="panel exp">
          <h3>หลักการทำงาน (How it works)</h3>
          <p>แบ่งโหนดตามเงื่อนไข (Feature Split) เพื่อลดค่า Entropy / Gini Impurity ให้ได้มากที่สุด</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('vizCanvas');
    const ctx = canvas.getContext('2d');
    
    
        let splitX = 300, splitY = 200;
        function setupControls(ctrl) {
            ctrl.innerHTML = `
                <div class="control-group">
                    <label>Vertical Split Threshold X: <span id="sx-val">300</span></label>
                    <input type="range" id="sx" min="100" max="500" value="300" step="10">
                </div>
                <div class="control-group">
                    <label>Horizontal Split Threshold Y: <span id="sy-val">200</span></label>
                    <input type="range" id="sy" min="50" max="350" value="200" step="10">
                </div>
            `;
            document.getElementById('sx').oninput = (e) => { splitX = parseInt(e.target.value); document.getElementById('sx-val').innerText = splitX; draw(); };
            document.getElementById('sy').oninput = (e) => { splitY = parseInt(e.target.value); document.getElementById('sy-val').innerText = splitY; draw(); };
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Regions
            ctx.fillStyle = 'rgba(56, 189, 248, 0.15)'; ctx.fillRect(0, 0, splitX, canvas.height);
            ctx.fillStyle = 'rgba(251, 146, 60, 0.15)'; ctx.fillRect(splitX, 0, canvas.width - splitX, splitY);
            ctx.fillStyle = 'rgba(192, 132, 252, 0.15)'; ctx.fillRect(splitX, splitY, canvas.width - splitX, canvas.height - splitY);

            // Lines
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(splitX, 0); ctx.lineTo(splitX, canvas.height); ctx.stroke();

            ctx.strokeStyle = '#fb923c'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(splitX, splitY); ctx.lineTo(canvas.width, splitY); ctx.stroke();

            // Tree diagram top right overlay
            ctx.fillStyle = '#f8fafc'; ctx.font = '14px sans-serif';
            ctx.fillText(`Split 1: X <= ${splitX}`, 20, 30);
            ctx.fillText(`Split 2: Y <= ${splitY} (ถ้า X > ${splitX})`, 20, 50);
        }
        

    if(typeof initData === 'function') initData();
    setupControls(document.getElementById('controls'));
    draw();
  </script>
</body>
</html>
