<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transformer (Self-Attention) - Interactive Visualizer</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .back-btn { color: var(--accent-blue); text-decoration: none; font-weight: bold; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    .panel { background: var(--card-bg); border: 1px solid #334155; border-radius: 8px; padding: 20px; }
    .control-group { margin-bottom: 18px; }
    .control-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .control-group input[type="range"] { width: 100%; }
    .btn { width: 100%; padding: 10px; background: var(--accent-blue); border: none; border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; }
    canvas { background: #0b1120; border-radius: 8px; border: 1px solid #334155; display: block; width: 100%; height: auto; }
    .exp { margin-top: 20px; line-height: 1.6; color: #cbd5e1; }
    .exp h3 { color: var(--accent-green); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <span style="color: var(--accent-blue); font-size: 0.85rem; text-transform: uppercase;">Deep Learning Architecture</span>
        <h2>11. Transformer (Self-Attention)</h2>
      </div>
      <a href="ml_visualizers_index.html" class="back-btn">⬅ กลับไปที่เมนูหลัก</a>
    </header>

    <div class="grid">
      <div class="panel" id="controls"></div>
      <div>
        <canvas id="vizCanvas" width="600" height="400"></canvas>
        <div class="panel exp">
          <h3>หลักการทำงาน (How it works)</h3>
          <p>กลไก Multi-Head Self-Attention คำนวณความสัมพันธ์ของทุกคำในประโยคโดยตรงแบบ Parallel</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('vizCanvas');
    const ctx = canvas.getContext('2d');
    
    
        let attFocus = 0.9;
        function setupControls(ctrl) {
            ctrl.innerHTML = `
                <div class="control-group">
                    <label>Attention Weight (it ➔ animal): <span id="a-val">0.9</span></label>
                    <input type="range" id="a" min="0.1" max="1.0" value="0.9" step="0.1">
                </div>
            `;
            document.getElementById('a').oninput = (e) => { attFocus = parseFloat(e.target.value); document.getElementById('a-val').innerText = attFocus; draw(); };
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let tokens = ["The", "animal", "didn't", "cross", "street", "because", "it", "was", "tired"];
            let step = canvas.width / (tokens.length + 1);
            let y = 260;

            // Tokens
            tokens.forEach((t, i) => {
                let x = (i+1)*step;
                ctx.fillStyle = (t==='it' || t==='animal') ? '#fb923c' : '#38bdf8';
                ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ffffff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(t, x, y + 25);
            });

            // Attention Arc
            let xIt = 7 * step;
            let xAnimal = 2 * step;
            ctx.strokeStyle = `rgba(74, 222, 128, ${attFocus})`;
            ctx.lineWidth = attFocus * 8;
            ctx.beginPath();
            ctx.moveTo(xIt, y);
            ctx.quadraticCurveTo((xIt+xAnimal)/2, y - 160, xAnimal, y);
            ctx.stroke();

            ctx.textAlign = 'left';
        }
        

    if(typeof initData === 'function') initData();
    setupControls(document.getElementById('controls'));
    draw();
  </script>
</body>
</html>
