<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Vector Machine (SVM) - Interactive Visualizer</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .back-btn { color: var(--accent-blue); text-decoration: none; font-weight: bold; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    .panel { background: var(--card-bg); border: 1px solid #334155; border-radius: 8px; padding: 20px; }
    .control-group { margin-bottom: 18px; }
    .control-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .control-group input[type="range"] { width: 100%; }
    .btn { width: 100%; padding: 10px; background: var(--accent-blue); border: none; border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; }
    canvas { background: #0b1120; border-radius: 8px; border: 1px solid #334155; display: block; width: 100%; height: auto; }
    .exp { margin-top: 20px; line-height: 1.6; color: #cbd5e1; }
    .exp h3 { color: var(--accent-green); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <span style="color: var(--accent-blue); font-size: 0.85rem; text-transform: uppercase;">Supervised Learning</span>
        <h2>6. Support Vector Machine (SVM)</h2>
      </div>
      <a href="ml_visualizers_index.html" class="back-btn">⬅ กลับไปที่เมนูหลัก</a>
    </header>

    <div class="grid">
      <div class="panel" id="controls"></div>
      <div>
        <canvas id="vizCanvas" width="600" height="400"></canvas>
        <div class="panel exp">
          <h3>หลักการทำงาน (How it works)</h3>
          <p>สร้าง Hyperplane ตัดแบ่งคลาสข้อมูลโดยให้ระยะขอบ (Margin) กว้างที่สุดเท่าที่เป็นไปได้</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('vizCanvas');
    const ctx = canvas.getContext('2d');
    
    
        let margin = 40;
        function setupControls(ctrl) {
            ctrl.innerHTML = `
                <div class="control-group">
                    <label>Margin Width: <span id="m-val">40</span></label>
                    <input type="range" id="m" min="15" max="80" value="40" step="5">
                </div>
            `;
            document.getElementById('m').oninput = (e) => { margin = parseInt(e.target.value); document.getElementById('m-val').innerText = margin; draw(); };
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let midX = canvas.width / 2;
            let midY = canvas.height / 2;
            
            // Draw Margin Band
            ctx.fillStyle = 'rgba(56, 189, 248, 0.1)';
            ctx.beginPath();
            ctx.moveTo(midX - margin - 100, 0); ctx.lineTo(midX + margin + 100, canvas.height);
            ctx.lineTo(midX - margin + 100, canvas.height); ctx.lineTo(midX + margin - 100, 0);
            ctx.fill();

            // Hyperplane
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(midX - 100, 0); ctx.lineTo(midX + 100, canvas.height); ctx.stroke();

            // Margin boundaries
            ctx.strokeStyle = '#4ade80'; ctx.setLineDash([5, 5]); ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(midX - 100 - margin, 0); ctx.lineTo(midX + 100 - margin, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(midX - 100 + margin, 0); ctx.lineTo(midX + 100 + margin, canvas.height); ctx.stroke();
            ctx.setLineDash([]);

            // Points
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(midX - 100 - margin + 10, 50, 8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(midX - 150, 200, 8, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#fb923c';
            ctx.beginPath(); ctx.arc(midX + 100 + margin - 10, 350, 8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(midX + 150, 150, 8, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#f8fafc'; ctx.font = '14px sans-serif';
            ctx.fillText('Maximum Margin Hyperplane', 20, 30);
        }
        

    if(typeof initData === 'function') initData();
    setupControls(document.getElementById('controls'));
    draw();
  </script>
</body>
</html>
