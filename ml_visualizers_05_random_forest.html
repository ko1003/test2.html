<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Forest - Interactive Visualizer</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .back-btn { color: var(--accent-blue); text-decoration: none; font-weight: bold; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    .panel { background: var(--card-bg); border: 1px solid #334155; border-radius: 8px; padding: 20px; }
    .control-group { margin-bottom: 18px; }
    .control-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .control-group input[type="range"] { width: 100%; }
    .btn { width: 100%; padding: 10px; background: var(--accent-blue); border: none; border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; }
    canvas { background: #0b1120; border-radius: 8px; border: 1px solid #334155; display: block; width: 100%; height: auto; }
    .exp { margin-top: 20px; line-height: 1.6; color: #cbd5e1; }
    .exp h3 { color: var(--accent-green); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <span style="color: var(--accent-blue); font-size: 0.85rem; text-transform: uppercase;">Supervised Learning</span>
        <h2>5. Random Forest</h2>
      </div>
      <a href="ml_visualizers_index.html" class="back-btn">⬅ กลับไปที่เมนูหลัก</a>
    </header>

    <div class="grid">
      <div class="panel" id="controls"></div>
      <div>
        <canvas id="vizCanvas" width="600" height="400"></canvas>
        <div class="panel exp">
          <h3>หลักการทำงาน (How it works)</h3>
          <p>การรวมโมเดลต้นไม้หลายต้น (Ensemble Learning) โดยใช้วิธี Bagging เพื่อลด Variance</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('vizCanvas');
    const ctx = canvas.getContext('2d');
    
    
        let numTrees = 5;
        function setupControls(ctrl) {
            ctrl.innerHTML = `
                <div class="control-group">
                    <label>จำนวนต้นไม้ (Number of Trees): <span id="t-val">5</span></label>
                    <input type="range" id="t" min="1" max="10" value="5" step="1">
                </div>
            `;
            document.getElementById('t').oninput = (e) => { numTrees = parseInt(e.target.value); document.getElementById('t-val').innerText = numTrees; draw(); };
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let treeWidth = canvas.width / numTrees;
            for(let i=0; i<numTrees; i++) {
                let cx = i * treeWidth + treeWidth/2;
                let cy = 100;
                // Draw Tree Icon
                ctx.fillStyle = '#4ade80';
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - 25, cy + 60); ctx.lineTo(cx + 25, cy + 60); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(cx, cy + 30); ctx.lineTo(cx - 35, cy + 100); ctx.lineTo(cx + 35, cy + 100); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#78350f'; ctx.fillRect(cx - 6, cy + 100, 12, 30);
                
                // Connection to Majority Vote
                ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
                ctx.beginPath(); ctx.moveTo(cx, cy + 130); ctx.lineTo(canvas.width/2, 320); ctx.stroke();
                ctx.setLineDash([]);
            }
            // Final Decision Node
            ctx.fillStyle = '#fb923c'; ctx.beginPath(); ctx.arc(canvas.width/2, 320, 25, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('Majority Vote', canvas.width/2, 324);
            ctx.textAlign = 'left';
        }
        

    if(typeof initData === 'function') initData();
    setupControls(document.getElementById('controls'));
    draw();
  </script>
</body>
</html>
