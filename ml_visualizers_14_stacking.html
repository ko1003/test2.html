<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacking Model - Interactive Visualizer</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .back-btn { color: var(--accent-blue); text-decoration: none; font-weight: bold; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    .panel { background: var(--card-bg); border: 1px solid #334155; border-radius: 8px; padding: 20px; }
    .control-group { margin-bottom: 18px; }
    .control-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .control-group input[type="range"] { width: 100%; }
    .btn { width: 100%; padding: 10px; background: var(--accent-blue); border: none; border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; }
    canvas { background: #0b1120; border-radius: 8px; border: 1px solid #334155; display: block; width: 100%; height: auto; }
    .exp { margin-top: 20px; line-height: 1.6; color: #cbd5e1; }
    .exp h3 { color: var(--accent-green); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <span style="color: var(--accent-blue); font-size: 0.85rem; text-transform: uppercase;">Supervised Learning</span>
        <h2>14. Stacking Model</h2>
      </div>
      <a href="ml_visualizers_index.html" class="back-btn">⬅ กลับไปที่เมนูหลัก</a>
    </header>

    <div class="grid">
      <div class="panel" id="controls"></div>
      <div>
        <canvas id="vizCanvas" width="600" height="400"></canvas>
        <div class="panel exp">
          <h3>หลักการทำงาน (How it works)</h3>
          <p>นำผลทำนายจากหลากหลาย Base Models ป้อนเข้าสู่ Meta-Model เพื่อการทำนายขั้นสุดท้าย</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('vizCanvas');
    const ctx = canvas.getContext('2d');

    let stackConfig = {
        knn: 3,
        forest: 5,
        svm: 40,
        metaWeight: 0.7,
        threshold: 0.5
    };

    function syncLabels() {
        document.getElementById('knn-val').innerText = stackConfig.knn;
        document.getElementById('forest-val').innerText = stackConfig.forest;
        document.getElementById('svm-val').innerText = stackConfig.svm;
        document.getElementById('meta-val').innerText = stackConfig.metaWeight.toFixed(2);
        document.getElementById('threshold-val').innerText = stackConfig.threshold.toFixed(2);
    }

    function setupControls(ctrl) {
        ctrl.innerHTML = `
            <div class="control-group">
                <label>KNN neighbors: <span id="knn-val">3</span></label>
                <input type="range" id="knn" min="1" max="9" value="3" step="1">
            </div>
            <div class="control-group">
                <label>Random Forest trees: <span id="forest-val">5</span></label>
                <input type="range" id="forest" min="1" max="10" value="5" step="1">
            </div>
            <div class="control-group">
                <label>SVM margin: <span id="svm-val">40</span></label>
                <input type="range" id="svm" min="10" max="80" value="40" step="5">
            </div>
            <div class="control-group">
                <label>Meta weight: <span id="meta-val">0.70</span></label>
                <input type="range" id="meta" min="0.1" max="1" value="0.7" step="0.05">
            </div>
            <div class="control-group">
                <label>Decision threshold: <span id="threshold-val">0.50</span></label>
                <input type="range" id="threshold" min="0.1" max="1" value="0.5" step="0.05">
            </div>
            <button class="btn" onclick="resetDefaults();">รีเซ็ตค่าเริ่มต้น</button>
        `;

        document.getElementById('knn').oninput = (e) => { stackConfig.knn = parseInt(e.target.value); syncLabels(); draw(); };
        document.getElementById('forest').oninput = (e) => { stackConfig.forest = parseInt(e.target.value); syncLabels(); draw(); };
        document.getElementById('svm').oninput = (e) => { stackConfig.svm = parseInt(e.target.value); syncLabels(); draw(); };
        document.getElementById('meta').oninput = (e) => { stackConfig.metaWeight = parseFloat(e.target.value); syncLabels(); draw(); };
        document.getElementById('threshold').oninput = (e) => { stackConfig.threshold = parseFloat(e.target.value); syncLabels(); draw(); };
    }

    function resetDefaults() {
        stackConfig = {
            knn: 3,
            forest: 5,
            svm: 40,
            metaWeight: 0.7,
            threshold: 0.5
        };

        document.getElementById('knn').value = stackConfig.knn;
        document.getElementById('forest').value = stackConfig.forest;
        document.getElementById('svm').value = stackConfig.svm;
        document.getElementById('meta').value = stackConfig.metaWeight;
        document.getElementById('threshold').value = stackConfig.threshold;
        syncLabels();
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const baseScores = [
            stackConfig.knn / 9,
            stackConfig.forest / 10,
            stackConfig.svm / 80
        ];

        const combined = baseScores.reduce((sum, v) => sum + v, 0) / baseScores.length;
        const metaScore = combined * stackConfig.metaWeight;
        const prediction = metaScore >= stackConfig.threshold ? 'Class A' : 'Class B';

        const models = ["KNN", "Random Forest", "SVM"];
        const yStep = canvas.height / 4;

        models.forEach((m, i) => {
            const y = (i + 1) * yStep;
            const width = 120 + baseScores[i] * 80;
            const x = 60;

            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(x, y - 20, width, 40);
            ctx.fillStyle = '#000';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(m, x + 10, y + 5);

            ctx.fillStyle = '#e2e8f0';
            ctx.font = '11px sans-serif';
            ctx.fillText((baseScores[i] * 100).toFixed(0) + '%', x + 10, y + 18);

            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + width, y);
            ctx.lineTo(360, canvas.height / 2);
            ctx.stroke();
        });

        ctx.fillStyle = '#fb923c';
        ctx.fillRect(360, canvas.height / 2 - 30, 170, 60);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('Meta-Model', 390, canvas.height / 2 + 5);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('Prediction: ' + prediction, 330, 330);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '12px sans-serif';
        ctx.fillText('Meta score: ' + metaScore.toFixed(2), 330, 350);
        ctx.fillText('Threshold: ' + stackConfig.threshold.toFixed(2), 330, 368);
    }

    if(typeof initData === 'function') initData();
    setupControls(document.getElementById('controls'));
    syncLabels();
    draw();
  </script>
</body>
</html>
