<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logistic Regression - Interactive Visualizer</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .back-btn { color: var(--accent-blue); text-decoration: none; font-weight: bold; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    .panel { background: var(--card-bg); border: 1px solid #334155; border-radius: 8px; padding: 20px; }
    .control-group { margin-bottom: 18px; }
    .control-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .control-group input[type="range"] { width: 100%; }
    .btn { width: 100%; padding: 10px; background: var(--accent-blue); border: none; border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; }
    canvas { background: #0b1120; border-radius: 8px; border: 1px solid #334155; display: block; width: 100%; height: auto; }
    .exp { margin-top: 20px; line-height: 1.6; color: #cbd5e1; }
    .exp h3 { color: var(--accent-green); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <span style="color: var(--accent-blue); font-size: 0.85rem; text-transform: uppercase;">Supervised Learning</span>
        <h2>2. Logistic Regression</h2>
      </div>
      <a href="ml_visualizers_index.html" class="back-btn">⬅ กลับไปที่เมนูหลัก</a>
    </header>

    <div class="grid">
      <div class="panel" id="controls"></div>
      <div>
        <canvas id="vizCanvas" width="600" height="400"></canvas>
        <div class="panel exp">
          <h3>หลักการทำงาน (How it works)</h3>
          <p>การจำแนกประเภทข้อมูลไบนารี โดยใช้ฟังก์ชัน Sigmoid แปลงค่าเป็นความน่าจะเป็น (0 ถึง 1)</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('vizCanvas');
    const ctx = canvas.getContext('2d');
    
    
        let thresh = 0.5, steepness = 1.0;
        function setupControls(ctrl) {
            ctrl.innerHTML = `
                <div class="control-group">
                    <label>Decision Threshold: <span id="t-val">0.5</span></label>
                    <input type="range" id="t" min="0.1" max="0.9" value="0.5" step="0.05">
                </div>
                <div class="control-group">
                    <label>Steepness (k): <span id="s-val">1.0</span></label>
                    <input type="range" id="s" min="0.2" max="3.0" value="1.0" step="0.1">
                </div>
            `;
            document.getElementById('t').oninput = (e) => { thresh = parseFloat(e.target.value); document.getElementById('t-val').innerText = thresh; draw(); };
            document.getElementById('s').oninput = (e) => { steepness = parseFloat(e.target.value); document.getElementById('s-val').innerText = steepness; draw(); };
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Curve
            ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 3;
            ctx.beginPath();
            for(let x=0; x<canvas.width; x++) {
                let z = ((x - canvas.width/2) / 40) * steepness;
                let prob = 1 / (1 + Math.exp(-z));
                let y = canvas.height - (prob * (canvas.height - 80) + 40);
                if(x===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            // Threshold line
            let tY = canvas.height - (thresh * (canvas.height - 80) + 40);
            ctx.strokeStyle = '#4ade80'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, tY); ctx.lineTo(canvas.width, tY); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#4ade80'; ctx.font = '14px sans-serif';
            ctx.fillText('Threshold: P = ' + thresh, 20, tY - 10);
        }
        

    if(typeof initData === 'function') initData();
    setupControls(document.getElementById('controls'));
    draw();
  </script>
</body>
</html>
