<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNN (Convolutional Network) - Interactive Visualizer</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .back-btn { color: var(--accent-blue); text-decoration: none; font-weight: bold; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    .panel { background: var(--card-bg); border: 1px solid #334155; border-radius: 8px; padding: 20px; }
    .control-group { margin-bottom: 18px; }
    .control-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .control-group input[type="range"] { width: 100%; }
    .btn { width: 100%; padding: 10px; background: var(--accent-blue); border: none; border-radius: 4px; color: #000; font-weight: bold; cursor: pointer; }
    canvas { background: #0b1120; border-radius: 8px; border: 1px solid #334155; display: block; width: 100%; height: auto; }
    .exp { margin-top: 20px; line-height: 1.6; color: #cbd5e1; }
    .exp h3 { color: var(--accent-green); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <span style="color: var(--accent-blue); font-size: 0.85rem; text-transform: uppercase;">Deep Learning Architecture</span>
        <h2>9. CNN (Convolutional Network)</h2>
      </div>
      <a href="ml_visualizers_index.html" class="back-btn">⬅ กลับไปที่เมนูหลัก</a>
    </header>

    <div class="grid">
      <div class="panel" id="controls"></div>
      <div>
        <canvas id="vizCanvas" width="600" height="400"></canvas>
        <div class="panel exp">
          <h3>หลักการทำงาน (How it works)</h3>
          <p>การสกัดคุณลักษณะ (Features) จากภาพด้วย Filter Kernel และคำนวณ Feature Map</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('vizCanvas');
    const ctx = canvas.getContext('2d');
    
    
        let kSize = 3;
        function setupControls(ctrl) {
            ctrl.innerHTML = `
                <div class="control-group">
                    <label>Kernel Size: <span id="k-val">3x3</span></label>
                    <input type="range" id="k" min="2" max="4" value="3" step="1">
                </div>
            `;
            document.getElementById('k').oninput = (e) => { kSize = parseInt(e.target.value); document.getElementById('k-val').innerText = `${kSize}x${kSize}`; draw(); };
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let tileSize = 22;
            let startX = 60, startY = 80;

            // Input Matrix 8x8
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(startX + c*tileSize, startY + r*tileSize, tileSize, tileSize);
                    ctx.strokeStyle = '#475569'; ctx.strokeRect(startX + c*tileSize, startY + r*tileSize, tileSize, tileSize);
                }
            }

            // Filter Matrix highlight
            ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 3;
            ctx.strokeRect(startX, startY, kSize*tileSize, kSize*tileSize);

            // Arrow
            ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 16px sans-serif';
            ctx.fillText("Conv Operation ➔", 260, 160);

            // Feature Map Output
            let outX = 420;
            let outDim = 9 - kSize;
            for(let r=0; r<outDim; r++) {
                for(let c=0; c<outDim; c++) {
                    ctx.fillStyle = '#334155'; ctx.fillRect(outX + c*tileSize, startY + r*tileSize, tileSize, tileSize);
                    ctx.strokeStyle = '#38bdf8'; ctx.strokeRect(outX + c*tileSize, startY + r*tileSize, tileSize, tileSize);
                }
            }
        }
        

    if(typeof initData === 'function') initData();
    setupControls(document.getElementById('controls'));
    draw();
  </script>
</body>
</html>
